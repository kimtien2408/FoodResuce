<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - FoodRescue</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <a class="logo" href="{{ url_for('index') }}">🌿 FoodRescue Việt Nam</a>
            <h1>Đăng nhập</h1>
            <p>Đăng nhập để tiếp tục giải cứu những món ăn ngon.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="post">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" required>
                </div>
                <button class="button auth-submit" type="submit">Đăng nhập</button>
            </form>

            <p class="auth-footer">Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký ngay</a></p>
        </section>
    </main>
</body>
</html>

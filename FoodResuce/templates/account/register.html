<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - FoodRescue</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <a class="logo" href="{{ url_for('index') }}">🌿 FoodRescue Việt Nam</a>
            <h1>Đăng ký</h1>
            <p>Tạo tài khoản để bắt đầu giải cứu thực phẩm cuối ngày.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form action="{{ url_for('register') }}" method="post">
                <div class="form-group">
                    <label for="full_name">Họ và tên</label>
                    <input id="full_name" name="full_name" type="text" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="phone_number">Số điện thoại</label>
                    <input id="phone_number" name="phone_number" type="tel" placeholder="0901234567" required>
                </div>
                <div class="form-group">
                    <label for="role">Bạn đăng ký với vai trò</label>
                    <select id="role" name="role" required>
                        <option value="Customer">Khách hàng</option>
                        <option value="ShopOwner">Chủ cửa hàng</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input id="password" name="password" type="password" minlength="6" placeholder="Tối thiểu 6 ký tự" required>
                </div>
                <button class="button auth-submit" type="submit">Tạo tài khoản</button>
            </form>

            <p class="auth-footer">Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a></p>
        </section>
    </main>
</body>
</html>

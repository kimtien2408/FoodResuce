<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa sản phẩm - FoodRescue</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="shop-index-page">
    <main class="container product-page">
        <a class="back-link" href="{{ url_for('shop_dashboard') }}">← Quay lại kho hàng</a>
        <section class="shop-panel product-page-panel">
            <p class="eyebrow">Sản phẩm #{{ batch.BatchId }}</p>
            <h1>Chỉnh sửa sản phẩm</h1>
            <form class="shop-form product-page-form" action="{{ url_for('save_shop_product') }}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="batch_id" value="{{ batch.BatchId }}">
                <input type="hidden" name="current_image" value="{{ batch.ImageUrl or '' }}">
                <label>Tên món<input name="food_name" type="text" value="{{ batch.FoodName }}" required></label>
                <label>Đổi hình ảnh<input name="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp"></label>
                <label>Giá gốc<input name="original_price" type="number" value="{{ batch.OriginalPrice }}" min="0" step="1000" required></label>
                <label>Giá giải cứu<input name="rescue_price" type="number" value="{{ batch.RescuePrice }}" min="0" step="1000" required></label>
                <label>Số lượng<input name="available_quantity" type="number" value="{{ batch.AvailableQuantity }}" min="0" required></label>
                <label>Giờ bắt đầu nhận<input name="pickup_start_time" type="time" value="{{ batch.PickupStartTime }}" required></label>
                <label>Giờ kết thúc nhận<input name="pickup_end_time" type="time" value="{{ batch.PickupEndTime }}" required></label>
                <button class="shop-submit" type="submit">Lưu thay đổi</button>
            </form>
        </section>
    </main>
</body>
</html>
